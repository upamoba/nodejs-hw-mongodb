tags: [Contacts]
summary: Get contact by ID
operationId: getContactById
description: Returns the user's contact by ObjectId.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string }
responses:
  "200":
    description: OK
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                message: { example: "Contact fetched successfully" }
                data:    { $ref: ../../../components/schemas/Contact.yaml }
        examples:
          ok:
            value:
              status: 200
              message: "Contact fetched successfully"
              data:
                _id: "68e6eaeb61b8a6f48903a256"
                name: "John Doe"
                phoneNumber: "+380501112233"
                email: "john.doe@example.com"
                contactType: "work"
                isFavourite: false
                photo: "https://res.cloudinary.com/demo/image/upload/v1/photo.jpg"
                userId: "66c0c1c7e9c2f6b2d1a9f123"
                createdAt: "2025-10-08T14:39:20.123Z"
                updatedAt: "2025-10-08T14:39:20.123Z"
  "401":
    $ref: ../../../components/responses/401.yaml
  "404":
    description: Not found
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                message: { example: "Contact not found" }
                data:
                  type: "null"
        examples:
          notFound:
            value:
              status: 404
              message: "Contact not found"
              data: null
  "500":
    $ref: ../../../components/responses/500.yaml
