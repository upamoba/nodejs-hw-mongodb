tags: [Contacts]
summary: Update contact (fields and/or photo)
operationId: updateContact
description: Updates contact fields (multipart/form-data supported for photo).
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string }
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object

        properties:
          name:        { type: string }
          phoneNumber: { type: string }
          email:       { type: string, format: email }
          contactType: { type: string, enum: [work, home, personal] }
          isFavourite: { type: boolean }
          photo:       { type: string, format: binary }
responses:
  "200":
    description: OK
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../components/schemas/Envelope.yaml
            - type: object
              properties:
                message: { example: "Contact updated successfully" }
                data:    { $ref: ../../components/schemas/Contact.yaml }
        examples:
          ok:
            value:
              status: 200
              message: "Contact updated successfully"
              data:
                _id: "68e6eaeb61b8a6f48903a256"
                name: "Jane Doe"
                phoneNumber: "+380501112233"
                email: "jane.doe@example.com"
                contactType: "home"
                isFavourite: true
                photo: "https://res.cloudinary.com/demo/image/upload/v1/photo-updated.jpg"
                userId: "66c0c1c7e9c2f6b2d1a9f123"
                createdAt: "2025-10-08T14:39:20.123Z"
                updatedAt: "2025-10-18T11:55:20.123Z"
  "400":
    description: Validation error
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../components/schemas/Envelope.yaml
            - type: object
              properties:
                message: { example: "Validation error" }
                data:
                  type: array
                  items: { type: string }
        examples:
          bad:
            value:
              status: 400
              message: "Validation error"
              data: ["email must be a valid email"]
  "401":
    $ref: ../../components/responses/401.yaml
  "404":
    description: Not found
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../components/schemas/Envelope.yaml
            - type: object
              properties:
                message: { example: "Contact not found" }
                data:
                  type: "null"
        examples:
          notFound:
            value:
              status: 404
              message: "Contact not found"
              data: null
  "500":
    $ref: ../../components/responses/500.yaml
